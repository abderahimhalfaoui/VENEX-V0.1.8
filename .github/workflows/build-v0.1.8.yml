name: VENEX V0.1.8 Build

on:
  push:
    branches: [main]
    paths:
      - "VENEX_V0.1.8.zip"
      - ".github/workflows/build-v0.1.8.yml"
  workflow_dispatch:
    inputs:
      abi:
        description: "Android ABI to build"
        required: true
        default: "arm64-v8a"
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86_64]

permissions:
  contents: write

concurrency:
  group: venex-v0.1.8-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: "27.2.12479018"
      CMAKE_VERSION: "3.22.1"
      VENEX_ABI: ${{ inputs.abi || 'arm64-v8a' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          test -s VENEX_V0.1.8.zip
          mkdir -p source
          unzip -q VENEX_V0.1.8.zip -d source
          test -f source/VENEX_V0.1.8/settings.gradle.kts
          test -x source/VENEX_V0.1.8/gradlew
          echo "VENEX_ROOT=$GITHUB_WORKSPACE/source/VENEX_V0.1.8" >> "$GITHUB_ENV"

      - name: Apply verified Compose import correction
        working-directory: source/VENEX_V0.1.8
        run: |
          FILE=app/src/main/kotlin/com/venex/app/ui/ChatScreen.kt
          if grep -q '^import androidx.compose.foundation.shape.RectangleShape$' "$FILE"; then
            sed -i 's|^import androidx.compose.foundation.shape.RectangleShape$|import androidx.compose.ui.graphics.RectangleShape|' "$FILE"
          fi
          grep -q '^import androidx.compose.ui.graphics.RectangleShape$' "$FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned llama.cpp dependency
        working-directory: source/VENEX_V0.1.8
        run: ./scripts/fetch-llama-cpp.sh

      - name: Run core JVM tests
        working-directory: source/VENEX_V0.1.8
        run: ./gradlew :core:test --stacktrace

      - name: Use real-time clock for tests with native worker threads
        working-directory: source/VENEX_V0.1.8
        run: |
          TEST=app/src/test/kotlin/com/venex/app/llm/LlamaCppRuntimeTest.kt
          if grep -q 'import kotlinx.coroutines.test.runTest' "$TEST"; then
            sed -i 's/import kotlinx.coroutines.test.runTest/import kotlinx.coroutines.runBlocking/' "$TEST"
            sed -i 's/= runTest {/= runBlocking {/' "$TEST"
            sed -i -E 's/^    fun (.*)\(\) = runBlocking \{/    fun \1(): Unit = runBlocking {/' "$TEST"
            sed -i 's|assertEquals(setOf("venex-llm-test"), b.threadNames)|assertTrue(b.threadNames.isNotEmpty() \&\& b.threadNames.all { it.startsWith("venex-llm-test") }, "native work must use dedicated dispatcher")|' "$TEST"
            echo "VENEX_TEST_CLOCK_PATCHED=true" >> "$GITHUB_ENV"
          fi
          ! grep -q 'runTest' "$TEST"
          grep -q 'import kotlinx.coroutines.runBlocking' "$TEST"
          test "$(grep -cE '^    fun .*\(\): Unit = runBlocking \{' "$TEST")" -ge 10

      - name: Run Android app unit tests
        working-directory: source/VENEX_V0.1.8
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Persist verified source fixes in repository archive
        if: env.VENEX_TEST_CLOCK_PATCHED == 'true'
        run: |
          cd source
          zip -X -qr ../VENEX_V0.1.8.zip VENEX_V0.1.8
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VENEX_V0.1.8.zip
          git commit -m "fix: use real-time coroutine clock in LLM runtime tests"
          git push

      - name: Build debug APK
        working-directory: source/VENEX_V0.1.8
        run: ./gradlew :app:assembleDebug -Pvenex.abis="$VENEX_ABI" --stacktrace

      - name: Verify APK and version
        working-directory: source/VENEX_V0.1.8
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          python3 - "$APK" <<'PY'
          import json, os, sys
          metadata = "app/build/outputs/apk/debug/output-metadata.json"
          with open(metadata, encoding="utf-8") as f:
              data = json.load(f)
          item = data["elements"][0]
          print("APK:", sys.argv[1], "size:", os.path.getsize(sys.argv[1]))
          print("versionName:", item.get("versionName"), "versionCode:", item.get("versionCode"))
          if item.get("versionName") != "0.1.8" or int(item.get("versionCode", 0)) != 8:
              raise SystemExit("Expected VENEX 0.1.8 / versionCode 8")
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: venex-v0.1.8-debug-apk
          path: source/VENEX_V0.1.8/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venex-v0.1.8-test-reports
          path: |
            source/VENEX_V0.1.8/core/build/reports/tests/
            source/VENEX_V0.1.8/core/build/test-results/
            source/VENEX_V0.1.8/app/build/reports/tests/
            source/VENEX_V0.1.8/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
